# Checks on every pull request and every push to main. Fork-safe: `pull_request` (never pull_request_target), read-only token,
# no secrets used, no third-party actions beyond GitHub's own checkout.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks, checksum-verified binary, full history)
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          ./gitleaks git . --redact --no-banner

      - name: Structure, forbidden files and addresses
        run: python3 .github/scripts/check-tree.py
