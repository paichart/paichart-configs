# Checks on every pull request and every push to main. Fork-safe: `pull_request` (never pull_request_target), read-only token,
# no secrets used, no third-party actions (GitHub's own checkout and setup-node only).
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks, checksum-verified binary, full history)
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          ./gitleaks git . --redact --no-banner

      - name: Structure, forbidden files and addresses
        run: python3 .github/scripts/check-tree.py

      - name: Variant twins (git-only vs git-live)
        run: python3 .github/scripts/check-twins.py

  # The spec checks a user runs before a program (docs/WRITING-A-SPEC.md), over every released use case — what users copy must
  # pass them. The checks live in the public pAIchart repo (paichart/paichart, main): check-spec-topology.py and
  # check-requirements-sources.ts, which parses a block with the platform's own grammar, so its dependencies are installed.
  spec-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: configs
      - uses: actions/checkout@v5
        with:
          repository: paichart/paichart
          ref: main
          path: paichart
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the public repo's dependencies (no install scripts) and generate the Prisma client
        working-directory: paichart
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx prisma generate
      - name: Both spec checks on every use case
        working-directory: paichart
        run: |
          fail=0
          for r in ../configs/usecases/*/*/requirements.md; do
            d=$(dirname "$r"); name=${d#../configs/usecases/}
            if ! python3 scripts/check-spec-topology.py --spec "$r" --topology "$d/topology.json"; then echo "::error::$name: check-spec-topology failed"; fail=1; fi
            if ! npx ts-node -r tsconfig-paths/register scripts/check-requirements-sources.ts --draft "$r"; then echo "::error::$name: check-requirements-sources failed"; fail=1; fi
          done
          exit $fail
