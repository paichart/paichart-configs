# Trading namespace: the orders-api workload, its service, configuration and ingress policy.
# Applied with: kubectl apply -f sample-workloads.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: trading
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: trading
  labels: { app: orders-api, tier: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: orders-api }
  template:
    metadata:
      labels: { app: orders-api, tier: backend }
    spec:
      containers:
        - name: orders-api
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          # NB: no resources.requests/limits set — the target gap for the demo change.
          env:
            - name: ORDERS_FEED_URL
              value: "http://market-data.trading.svc.cluster.local:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: trading
spec:
  selector: { app: orders-api }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api-config
  namespace: trading
data:
  LOG_LEVEL: "info"
  FEED_TIMEOUT_MS: "2500"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-api-ingress
  namespace: trading
spec:
  podSelector:
    matchLabels: { app: orders-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { tier: frontend }
      ports:
        - { protocol: TCP, port: 80 }
