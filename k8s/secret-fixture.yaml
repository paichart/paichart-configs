# REDACTION BAIT — FAKE values, kept on purpose. Never name this file in a requirements spec or a task: the platform REFUSES to
# hold it (a plaintext Secret is refused `secret-manifest`, owner decision G-5), and its connection string exists to prove R10
# redacts bytes read from Git (scripts/check-held-r10-lab-repo.ts, positive control). The rig applies it so the cluster harvest
# still sees a Secret's NAME and key NAMES ("api-token", "db-password") — never these values.
# Apply: kubectl apply -f secret-fixture.yaml  (after sample-workloads.yaml — the namespace lives there)
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api-metrics
  namespace: trading
data:
  # a connection-string-shaped value to exercise the R10 redaction families (config, not a Secret)
  METRICS_DSN: "postgres://metrics:hunter2@metrics-db.trading.svc:5432/orders"
---
apiVersion: v1
kind: Secret
metadata:
  name: orders-api-creds
  namespace: trading
type: Opaque
stringData:
  # list_secret_names must surface name + key NAMES ("api-token","db-password") but NEVER these values
  api-token: "s3cr3t-rig-token-do-not-leak"
  db-password: "rig-pw-do-not-leak"
